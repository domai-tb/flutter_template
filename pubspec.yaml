name: flutter_template
description: Flutter Template for Android, iOS, macOS, Windows, Linux and Web
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
